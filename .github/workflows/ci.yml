# CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_business_os
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_bG9jYWwuY2xlcmsuYWNjb3VudHMuZGV2JA
      CLERK_SECRET_KEY: sk_test_local_ci_secret
      CLERK_WEBHOOK_SIGNING_SECRET: whsec_local_ci_secret
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /app
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /app
      STORAGE_DRIVER: local
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_business_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare npm@11.17.0 --activate
          npm --version
      - name: Check package-lock.json is in sync
        run: node scripts/check-lockfile-sync.mjs
      - name: Install dependencies
        run: npm ci
      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for postgres..."
            sleep 1
          done
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Initialize database (Prisma)
        run: |
          # If you use migrations in production, consider `npx prisma migrate deploy` instead
          npx prisma db push --accept-data-loss
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
